<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#111;color:#eee;font:15px system-ui,sans-serif;display:flex}
button{padding:9px 15px;border:0;border-radius:8px;background:#2d5bff;color:#fff;font:inherit;cursor:pointer}
button.ghost{background:#262626}
button.danger{background:#3a1f1f;color:#ff9b9b}
input{padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#eee;font:inherit;width:100%}

/* rooms screen */
#rooms{margin:auto;width:min(420px,94vw);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:16px}
#rooms h1{margin:0;display:flex;align-items:center;gap:10px}
.brandlogo{width:42px;height:42px;object-fit:contain;border-radius:50%}
.modbtn{padding:3px 7px;font-size:11px;margin-left:4px;background:#3a1f1f;color:#ffb0b0}
.msgtools{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
#rooms small{line-height:1.4}
#prof{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#161616;border-radius:10px}
#rlist{overflow-y:auto;max-height:50vh;border:1px solid #2a2a2a;border-radius:10px}
#rbtns{display:flex;gap:8px}
#rbtns button{flex:1}

/* chat */
#app{display:flex;width:100%;height:100%}
#side{width:290px;border-right:1px solid #2a2a2a;display:flex;flex-direction:column;background:#161616}
#side header{padding:12px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:8px}
#side header div{flex:1;min-width:0}
#side header b,#side header small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side header small{color:#888;font-size:12px}
#side header button{padding:6px 9px;font-size:13px}
#list{flex:1;overflow-y:auto}
h2{margin:0;padding:12px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#888}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #1d1d1d}
.row:hover,.row.sel{background:#1f1f1f}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:#888;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:#2d5bff;border-radius:10px;padding:1px 7px;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.dot.on{background:#3ddc84}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#chat header{padding:12px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:10px;background:#1b1b1b}
#chat header b{flex:1}
#back{display:none;background:transparent;padding:4px 8px}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.line{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:85%}
.line.me{align-self:flex-end}
.msg{padding:7px 11px;border-radius:12px;background:#262626;white-space:pre-wrap;word-wrap:break-word;min-width:0}
.msg.me{background:#2d5bff}
.msg small{display:block;opacity:.6;font-size:11px;margin-bottom:2px}
.empty{color:#777;text-align:center;margin:30px 10px}
form{display:flex;gap:8px;padding:10px;border-top:1px solid #2a2a2a;background:#1b1b1b}
#t{flex:1;min-width:0}
#pickimg{display:none}
.msgimg{display:block;max-width:min(360px,65vw);max-height:320px;object-fit:contain;border-radius:8px;margin-top:5px;cursor:pointer}

/* avatars */
.avw{position:relative;flex:none;width:36px;height:36px}
.avw.sm{width:28px;height:28px}
.avw.big{width:96px;height:96px;align-self:center;font-size:36px}
.av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;user-select:none}
.avw .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border:2px solid #161616}

/* modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10}
#ov .card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:20px;width:min(340px,92vw);max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#ov h3{margin:0}
#ov label{color:#999;font-size:12px}
#ov hr{border:0;border-top:1px solid #333;width:100%;margin:4px 0}
#ov .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#ov .err{color:#ff7b7b;font-size:12px;min-height:14px}

@media(max-width:640px){
  #side{width:100%}
  #chat{display:none}
  body.chatopen #side{display:none}
  body.chatopen #chat{display:flex}
  #back{display:block}
}
</style>
</head>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const LS = {
  get: (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const uid = () => [...crypto.getRandomValues(new Uint8Array(12))].map((b) => b.toString(16).padStart(2, "0")).join("");

// Public MQTT brokers (WebSocket). Tried in order until one connects.
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081"];
const enc = new TextEncoder(), dec = new TextDecoder();
const ECDSA = { name: "ECDSA", namedCurve: "P-256" }, SIGN = { name: "ECDSA", hash: "SHA-256" };

// ---------- join codes ----------
// New join codes are 24 characters: 10 random secret bytes + 5 bytes of creator fingerprint.
// Older 32-character codes remain supported for existing rooms.
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32enc(bytes) {
  let bits = 0, v = 0, out = "";
  for (const b of bytes) { v = (v << 8) | b; bits += 8; while (bits >= 5) { out += B32[(v >>> (bits - 5)) & 31]; bits -= 5; } }
  if (bits) out += B32[(v << (5 - bits)) & 31];
  return out;
}
function b32dec(s) {
  let bits = 0, v = 0; const out = [];
  for (const ch of s) {
    const i = B32.indexOf(ch); if (i < 0) return null;
    v = (v << 5) | i; bits += 5;
    if (bits >= 8) { out.push((v >>> (bits - 8)) & 255); bits -= 8; }
  }
  return new Uint8Array(out);
}
function normalizeCode(input) {
  const s = String(input).toUpperCase().replace(/[^0-9A-Z]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1");
  return (s.length === 24 || s.length === 32) && [...s].every((c) => B32.includes(c)) ? s : null;
}
function normalizeShortCode(input) { const s = String(input).toUpperCase().replace(/[^0-9A-Z]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1"); return s.length === 5 && [...s].every((c) => B32.includes(c)) ? s : null; }
function makeShortCode() { return b32enc(crypto.getRandomValues(new Uint8Array(4))).slice(0, 5); }
const fmtCode = (r) => r.shortCode || (r.legacy ? r.code : r.code.match(/.{4}/g).join("-"));
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

// ---------- state ----------
let me = LS.get("lc:me", null) || {};
if (!me.id) me.id = uid();
me.name = typeof me.name === "string" ? me.name : "";
me.pic = validPic(me.pic);
let rooms = LS.get("lc:rooms", []);
let room = null, rid = "", topic = "", key = null, client = null, P = "";
let chats = {}, contacts = {}, unread = {}, online = {}, pics = {};
const bannedUsers = new Set();
let view = "global";
let lastRoomSeen = 0;

const saveRooms = () => LS.set("lc:rooms", rooms);
const saveMe = () => LS.set("lc:me", me);

function newRecord(input) {
  const canon = normalizeCode(input);
  if (canon) return { code: canon, name: "Room " + canon.slice(0, 4), pic: "", owner: false, ver: 0, used: Date.now() };
  const c = String(input).trim();
  return { code: c, name: c, pic: "", owner: false, legacy: true, ver: 0, used: Date.now() };
}

// ---------- crypto ----------
async function ridOf(code) {
  const h = await crypto.subtle.digest("SHA-256", enc.encode("lanchat-room:" + code.trim().toLowerCase()));
  return [...new Uint8Array(h)].slice(0, 12).map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function deriveRoom(code) {
  const norm = code.trim().toLowerCase();
  rid = await ridOf(code);
  topic = "lanchat/" + rid;
  const km = await crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveKey"]);
  key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: enc.encode("lanchat-salt-v1"), iterations: 150000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function unseal(buf) {
  const b = new Uint8Array(buf);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12))));
}

// ---------- room identity (creator signs name/picture) ----------
const infoPayload = (i) => enc.encode(JSON.stringify([i.name, i.pic, i.ver]));

async function signInfo(r, name, pic) {
  const ver = Math.max(Date.now(), (r.ver || 0) + 1);
  const priv = await crypto.subtle.importKey("jwk", r.priv, ECDSA, false, ["sign"]);
  const sig = new Uint8Array(await crypto.subtle.sign(SIGN, priv, infoPayload({ name, pic, ver })));
  return { name, pic, ver, pub: r.pub, sig: b64(sig) };
}
async function verifyInfo(code, info) {
  const bytes = b32dec(code);
  if (!bytes) return false;
  const pubRaw = unb64(info.pub);
  const fpLen = bytes.length === 15 ? 5 : 10;
  const fp = new Uint8Array(await crypto.subtle.digest("SHA-256", pubRaw)).slice(0, fpLen);
  for (let i = 0; i < fpLen; i++) if (fp[i] !== bytes[bytes.length - fpLen + i]) return false; // key must match the join code
  const pub = await crypto.subtle.importKey("raw", pubRaw, ECDSA, false, ["verify"]);
  return crypto.subtle.verify(SIGN, pub, unb64(info.sig), infoPayload(info));
}
async function createRoom(name, pic) {
  const kp = await crypto.subtle.generateKey(ECDSA, true, ["sign", "verify"]);
  const pubRaw = new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey));
  const fp = new Uint8Array(await crypto.subtle.digest("SHA-256", pubRaw)).slice(0, 5);
  const bytes = new Uint8Array(15);
  bytes.set(crypto.getRandomValues(new Uint8Array(10)));
  bytes.set(fp, 10);
  const r = { code: b32enc(bytes), shortCode: makeShortCode(), name, pic, owner: true, priv: await crypto.subtle.exportKey("jwk", kp.privateKey), pub: b64(pubRaw), ver: 0, used: Date.now() };
  r.info = await signInfo(r, name, pic);
  r.ver = r.info.ver;
  rooms.push(r); saveRooms();
  return r;
}
async function acceptInfo(i) {
  lastRoomSeen = Date.now();
  if (!room || room.legacy || !i) return;
  if (typeof i.name !== "string" || i.name.length > 40 || typeof i.ver !== "number" || typeof i.pub !== "string" || typeof i.sig !== "string") return;
  if (i.ver <= (room.ver || 0)) return;
  const pic = validPic(i.pic);
  if (i.pic && !pic) return;
  const info = { name: i.name, pic, ver: i.ver, pub: i.pub, sig: i.sig };
  try { if (!(await verifyInfo(room.code, info))) return; } catch { return; }
  if (info.ver <= (room.ver || 0)) return;
  Object.assign(room, { name: info.name, pic: info.pic, ver: info.ver, info });
  saveRooms(); renderHead(); renderList(); renderChat(); updateTitle();
}
function shareRoomInfo() {
  if (!room?.info) return;
  lastRoomSeen = Date.now(); // lets other pending timers know it's been handled
  publish({ t: "room", ...room.info });
}

// ---------- rooms screen ----------
function renderRooms() {
  $("#app").hidden = true; $("#rooms").hidden = false;
  document.title = "LAN Chat";
  $("#pav").replaceChildren(avatarEl(me.pic, me.name || "?", me.id, "sm"));
  $("#pname").textContent = me.name || "Set your name";
  const box = $("#rlist");
  box.replaceChildren();
  const sorted = [...rooms].sort((a, b) => (b.used || 0) - (a.used || 0));
  if (!sorted.length) box.append(el("div", { className: "empty", textContent: "No rooms yet. Create one or join with a code." }));
  for (const r of sorted) {
    box.append(el("div", { className: "row", onclick: () => openRoom(r.code) },

  }
}
async function forgetRoom(r) {

// ---------- short-code join requests ----------
const joinTopic = (shortCode) => "lanchat/join/" + shortCode;
const responseTopic = (shortCode, id) => "lanchat/response/" + shortCode + "/" + id;
const JOIN_ECDH = { name: "ECDH", namedCurve: "P-256" };
async function deriveJoinKey(privateKey, publicJwk) {
  const publicKey = await crypto.subtle.importKey("jwk", publicJwk, JOIN_ECDH, false, []);
  return crypto.subtle.deriveKey({ name: "ECDH", public: publicKey }, privateKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function handleJoinRequest(payload) {
  let req; try { req = JSON.parse(dec.decode(payload)); } catch { return; }
  if (!room?.owner || !room.shortCode || req.shortCode !== room.shortCode || typeof req.id !== "string" || !/^[0-9a-f]{24}$/.test(req.id) || typeof req.name !== "string" || !req.pub || Date.now() - Number(req.ts) > 120000 || Number(req.ts) > Date.now() + 30000) return;
  const replyTopic = responseTopic(room.shortCode, req.id);
  let approved = false;
  try { approved = window.confirm(`Join request for “${room.name}”\n\n${req.name.slice(0,24)} wants to join.\n\nAllow them to join?`); } catch {}
  if (!approved) { if (client?.connected) client.publish(replyTopic, JSON.stringify({ approved: false })); return; }
  try {
    const pair = await crypto.subtle.generateKey(JOIN_ECDH, true, ["deriveKey"]);
    const pub = await crypto.subtle.exportKey("jwk", pair.publicKey);
    const aes = await deriveJoinKey(pair.privateKey, req.pub);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, enc.encode(room.code)));
    const response = { approved: true, shortCode: room.shortCode, pub, iv: b64(iv), cipher: b64(cipher) };
    if (client?.connected) client.publish(replyTopic, JSON.stringify(response));
  } catch (e) { console.error("Join approval failed", e); }
}
async function requestJoin(shortCode, name, err) {
  const id = uid();
  const pair = await crypto.subtle.generateKey(JOIN_ECDH, true, ["deriveKey"]);
  const pub = await crypto.subtle.exportKey("jwk", pair.publicKey);
  return new Promise((resolve, reject) => {
    let temp = null, finished = false, connected = false;
    const timeout = setTimeout(() => finish(new Error("No response yet. Ask the room creator to keep the app open and try again.")), 90000);
    function finish(error, code) { if (finished) return; finished = true; clearTimeout(timeout); try { temp?.end(true); } catch {} error ? reject(error) : resolve(code); }
    function tryBroker(index) {
      if (finished) return;
      if (index >= BROKERS.length) return finish(new Error("Couldn't connect to a chat broker."));
      try {
        temp = mqtt.connect(BROKERS[index], { clientId: "lc_join_" + id.slice(0, 16), reconnectPeriod: 0, connectTimeout: 8000, clean: true });
      } catch { return tryBroker(index + 1); }
      let moved = false;
      const next = () => { if (finished || connected || moved) return; moved = true; try { temp?.end(true); } catch {} tryBroker(index + 1); };
      temp.on("connect", () => {
        connected = true;
        const rt = responseTopic(shortCode, id);
        temp.subscribe(rt, (subErr) => {
          if (subErr) return finish(new Error("Couldn't listen for the room creator's reply."));
          temp.publish(joinTopic(shortCode), JSON.stringify({ shortCode, id, name: String(name).slice(0,24), pub, ts: Date.now() }));
        });
      });
      temp.on("error", () => { if (!connected) next(); });
      temp.on("close", () => { if (!connected) next(); });
      temp.on("message", async (receivedTopic, payload) => {
        if (receivedTopic !== responseTopic(shortCode, id) || finished) return;
        try {
          const msg = JSON.parse(dec.decode(payload));
          if (!msg.approved) return finish(new Error("The room creator declined the request."));
          if (!msg.pub || !msg.iv || !msg.cipher) return;
          const aes = await deriveJoinKey(pair.privateKey, msg.pub);
          const code = dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(msg.iv) }, aes, unb64(msg.cipher)));
          if (!normalizeCode(code)) return finish(new Error("The approval reply was invalid."));
          finish(null, code);
        } catch { /* Ignore unrelated or forged replies. */ }
      });
    }
    tryBroker(0);
  });
}

// ---------- connection ----------
function setStatus(ok) { $("#st").className = "dot" + (ok ? " on" : ""); }
function connect(i) {
  if (client) { const old = client; client = null; old.end(true); }
  const c = (client = mqtt.connect(BROKERS[i % BROKERS.length], {
    clientId: "lc_" + me.id.slice(0, 8) + "_" + Math.random().toString(16).slice(2, 6),
    reconnectPeriod: 0, connectTimeout: 8000, clean: true,
  }));
  let up = false;
  c.on("connect", () => {
    up = true; setStatus(true); c.subscribe(topic);
    if (room.owner && room.shortCode) c.subscribe(joinTopic(room.shortCode));
    announce();
    if (room.owner) setTimeout(shareRoomInfo, 1000);
  });
  c.on("message", (receivedTopic, payload) => { if (room?.owner && room.shortCode && receivedTopic === joinTopic(room.shortCode)) handleJoinRequest(payload); else if (receivedTopic === topic) onPacket(payload); });
  c.on("close", () => {
    if (c !== client) return;
    setStatus(false);
    setTimeout(() => c === client && connect(up ? i : i + 1), up ? 2000 : 1000);
  });
  c.on("error", () => {});
}
async function publish(obj) {
  if (!client || !client.connected) return false;
  client.publish(topic, await seal(obj));
  return true;
}
function announce() { publish({ t: "hi", from: me.id, name: me.name, pic: me.pic || "", creator: !!room?.owner }); }

async function onPacket(p) {
  let m; try { m = await unseal(p); } catch { return; } // wrong code or junk
  if (m.t === "hi" && m.from !== me.id) {
    const fresh = !online[m.from];
    online[m.from] = { name: String(m.name).slice(0, 24), seen: Date.now(), creator: !!m.creator };
    if (m.creator) room.ownerId = m.from;
    const pic = validPic(m.pic);
    if (pic !== (pics[m.from] || "")) {
      if (pic) pics[m.from] = pic; else delete pics[m.from];
      save(); renderChat();
    }
    if (contacts[m.from] && contacts[m.from].name !== online[m.from].name) { contacts[m.from].name = online[m.from].name; save(); }
    if (fresh) {
      setTimeout(announce, Math.random() * 1500); // let newcomers see us quickly
      const t0 = Date.now(); // hand the newcomer the signed room name/picture (someone else may beat us to it)
      setTimeout(() => lastRoomSeen < t0 && shareRoomInfo(), 500 + Math.random() * 2500);
    }
    renderList();
  } else if (m.t === "msg") { if (!bannedUsers.has(m.from)) receive(m); }
  else if (m.t === "delete" && m.from === room?.ownerId) { for (const k of Object.keys(chats)) chats[k] = (chats[k] || []).filter(x => x.id !== m.messageId); save(); renderList(); renderChat(); }
  else if (m.t === "ban" && m.from === room?.ownerId && typeof m.userId === "string") { bannedUsers.add(m.userId); for (const k of Object.keys(chats)) chats[k] = (chats[k] || []).filter(x => x.from !== m.userId); save(); renderList(); renderChat(); }
  else if (m.t === "room") acceptInfo(m);
}

// ---------- messages ----------
function save() { LS.set(P + "state", { chats, contacts, unread, pics }); }

function receive(m) {
  if ((!m.text || typeof m.text !== "string") && !(typeof m.image === "string" && m.image.length < 140000)) return;
  if (!m.id) return;
  if (m.to && m.to !== me.id && m.from !== me.id) return; // DM for someone else
  const mine = m.from === me.id;
  if (bannedUsers.has(me.id) && !mine) return;
  const k = m.to === "" ? "global" : mine ? m.to : m.from;
  const l = (chats[k] = chats[k] || []);
  if (l.some((x) => x.id === m.id)) return;
  l.push({ id: m.id, from: m.from, name: String(m.name).slice(0, 24), to: m.to, text: typeof m.text === "string" ? m.text.slice(0, 2000) : "", image: typeof m.image === "string" && m.image.length < 140000 && /^data:image\/(jpeg|png|webp);base64,/.test(m.image) ? m.image : "", ts: Number(m.ts) || Date.now() });
  l.sort((a, b) => a.ts - b.ts);
  if (l.length > 500) l.splice(0, l.length - 500);
  if (k !== "global") {
    if (!contacts[k]) contacts[k] = { name: mine ? "unknown" : m.name };
    else if (!mine) contacts[k].name = m.name;
  }
  if (!mine && !(view === k && document.visibilityState === "visible")) {
    unread[k] = (unread[k] || 0) + 1;
    notify(m, k);
  }
  save(); renderList(); if (view === k) renderChat(); updateTitle();
}
function notify(m, k) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(k === "global" ? room.name + " · " + m.name : m.name, { body: m.text.slice(0, 200) }); } catch {}
}
function updateTitle() {
  const n = Object.values(unread).reduce((a, b) => a + b, 0);
  document.title = (n ? `(${n}) ` : "") + (room ? room.name : "LAN Chat");
}

$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const t = $("#t"), text = t.value.trim();
  if (!text) return;

  if (await publish(m)) { t.value = ""; receive(m); }
  else { $("#title").textContent = "Not connected, retrying..."; setTimeout(() => showView(view), 2000); }
};

// Image sharing: resize/compress locally so MQTT can carry it reliably.
async function prepareChatImage(file) {
  if (!file || !file.type.startsWith("image/")) throw new Error("Choose an image file.");
  if (file.size > 12 * 1024 * 1024) throw new Error("Images must be under 12 MB.");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = url; });
    const maxSide = 1000, scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const canvas = document.createElement("canvas"); canvas.width = Math.max(1, Math.round(img.width * scale)); canvas.height = Math.max(1, Math.round(img.height * scale));
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    for (const q of [0.72, 0.58, 0.44, 0.32]) { const data = canvas.toDataURL("image/jpeg", q); if (data.length <= 115000) return data; }
    throw new Error("That image is too large after compression. Try a smaller image.");
  } finally { URL.revokeObjectURL(url); }
}
$("#attach").onclick = () => $("#pickimg").click();
$("#pickimg").onchange = async (e) => {

    if (await publish(m)) { t.value = ""; receive(m); }
    else alert("Not connected yet. Try sending the image again when connected.");
  } catch (err) { alert(err.message || "Couldn't load that image."); }
  finally { input.value = ""; btn.disabled = false; btn.textContent = old; }
};

// ---------- chat UI ----------
const nameOf = (k) => (k === "global" ? room.name : contacts[k]?.name || online[k]?.name || "Chat");
function lastText(k) {

  const m = l[l.length - 1];
  return (m.from === me.id ? "You: " : k === "global" ? m.name + ": " : "") + (m.image ? "📷 Image" + (m.text ? " · " + m.text : "") : m.text);
}
function row(k, name, sub, onl) {

function renderHead() {
  $("#rav").replaceChildren(avatarEl(room.pic, room.name, room.code, "sm"));

function renderList() {
  const list = $("#list"); if (!list || !room) return;
  const now = Date.now();
  const live = Object.entries(online).filter(([, v]) => now - v.seen < 40000).map(([id, v]) => ({ id, name: v.name }));
  const liveIds = new Set(live.map((u) => u.id));
  list.replaceChildren(row("global", room.name, lastText("global")));
  const cs = Object.entries(contacts).sort((a, b) => a[1].name.localeCompare(b[1].name));
  if (cs.length) list.append(el("h2", { textContent: "Contacts" }));
  for (const [id, c] of cs) list.append(row(id, c.name, lastText(id), liveIds.has(id)));
  const others = live.filter((u) => !contacts[u.id]);
  if (others.length) list.append(el("h2", { textContent: "Online now" }));
  for (const u of others) list.append(row(u.id, u.name, "tap to message and save", true));
}
function renderChat() {
  if (!room) return;
  $("#hav").replaceChildren(avatar(view, nameOf(view), "sm"));
  const log = $("#log");
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.replaceChildren();

  if (!l.length) log.append(el("div", { className: "empty", textContent: "No messages yet." }));
  for (const m of l) {
    const mine = m.from === me.id;
    const time = new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const bubble = el("div", { className: "msg" + (mine ? " me" : "") },

      ...(m.text ? [el("span", { textContent: m.text })] : []),

    const line = el("div", { className: "line" + (mine ? " me" : "") });
    if (!mine) line.append(avatar(m.from, m.name, "sm"));

// ---------- avatars ----------
function validPic(p) {
  return typeof p === "string" && p.length < 20000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(p) ? p : "";
}
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatarEl(pic, name, id, cls = "") {
  const w = el("span", { className: "avw " + cls });
  if (pic) w.append(el("img", { className: "av", src: pic, alt: "" }));
  else w.append(el("span", { className: "av", textContent: (String(name).trim().charAt(0) || "?").toUpperCase(), style: "background:hsl(" + hue(id) + ",45%,38%)" }));
  return w;
}
function avatar(id, name, cls = "") {
  if (id === "global") return avatarEl(room.pic, room.name, room.code, cls);
  return avatarEl(id === me.id ? me.pic : pics[id], name, id, cls);
}
async function toAvatar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const S = 80, c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d"), side = Math.min(img.width, img.height);
    g.fillStyle = "#fff"; g.fillRect(0, 0, S, S);
    g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
    for (const q of [0.8, 0.6, 0.4]) { const d = c.toDataURL("image/jpeg", q); if (d.length < 15000) return d; }
    throw new Error("too big");
  } finally { URL.revokeObjectURL(url); }
}

}

    if (room) { renderHead(); renderList(); renderChat(); updateTitle(); announce(); } else renderRooms();
  } });
  kids.push(err, el("div", { className: "btns" }, saveBtn, el("button", { className: "ghost", textContent: "Cancel", onclick: closeModal })));
  showModal(...kids);
}
$("#gear").onclick = openSettings;

function openCreate() {
  if (!me.name) return openSettings();
  let pic = "";
  const err = el("div", { className: "err" });
  const name = el("input", { maxLength: 40, placeholder: "Room name" });
  const prev = center();
  const drawPrev = () => prev.replaceChildren(avatarEl(pic, name.value || "?", "newroom", "big"));
  name.oninput = drawPrev; drawPrev();
  const ch = chooser((p) => { pic = p; drawPrev(); }, err);
  const go = el("button", { textContent: "Create", onclick: async () => {
    const nm = name.value.trim().slice(0, 40);
    if (!nm) return (err.textContent = "Give the room a name.");
    if (!window.crypto?.subtle) return (err.textContent = "Encryption isn't available here. Open this file straight from your computer or over https.");
    go.disabled = true;
    const r = await createRoom(nm, pic);
    closeModal();
    openRoom(r.code);
  } });
  showModal(el("h3", { textContent: "Create a room" }), prev, ch.file,
    picButtons(ch, () => { pic = ""; drawPrev(); }),
    el("label", { textContent: "Room name" }), name, err,
    el("div", { className: "btns" }, go, el("button", { className: "ghost", textContent: "Cancel", onclick: closeModal })));
  name.focus();
}
function openJoin() {
  if (!me.name) return openSettings();
  const err = el("div", { className: "err" });
  const code = el("input", { placeholder: "Enter 5-character room code", autocomplete: "off", maxLength: 32 });
  const go = async () => {
    const raw = code.value.trim();
    if (!raw) return (err.textContent = "Enter a room code.");
    const shortCode = normalizeShortCode(raw);
    if (shortCode) {
      const existing = rooms.find((r) => r.shortCode === shortCode);
      if (existing) { closeModal(); return openRoom(existing.code); }
      if (!window.crypto?.subtle) return (err.textContent = "Secure joining isn't available in this browser.");
      err.textContent = "Requesting permission from the room creator…"; goBtn.disabled = true;
      try {
        const secret = await requestJoin(shortCode, me.name, err);
        let r = rooms.find((x) => x.code === secret);
        if (!r) { r = newRecord(secret); rooms.push(r); }
        r.shortCode = shortCode; saveRooms();
        closeModal(); await openRoom(r.code);
      } catch (e) { err.textContent = e.message || "Couldn't join the room."; goBtn.disabled = false; }
      return;
    }
    const canon = normalizeCode(raw);
    if (!canon) return (err.textContent = "Enter a valid 5-character code (or an older full join code).");
    let r = rooms.find((x) => x.code === canon);
    if (!r) { r = newRecord(canon); rooms.push(r); saveRooms(); }
    closeModal(); openRoom(r.code);
  };
  const goBtn = el("button", { textContent: "Request to join", onclick: go });
  code.addEventListener("keydown", (e) => e.key === "Enter" && go());
  showModal(el("h3", { textContent: "Join a room" }),
    el("label", { textContent: "Enter the 5-character code. The creator must approve your request." }), code, err,
    el("div", { className: "btns" }, goBtn, el("button", { className: "ghost", textContent: "Cancel", onclick: closeModal })));
  code.focus();
}
$("#rcreate").onclick = openCreate;
$("#rjoin").onclick = openJoin;

// ---------- start ----------
(async () => {
  const cur = LS.get("lc:room", "");
  if (cur && !rooms.some((r) => r.code === cur)) { rooms.push(newRecord(cur)); saveRooms(); } // carry over a room saved by an older version
  document.addEventListener("click", () => {
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  }, { once: true });
  if (cur && me.name && typeof mqtt !== "undefined" && window.crypto?.subtle) {
    try { await enterRoom(cur); return; } catch (e) { console.error(e); }
  }
  renderRooms();
  if (!me.name) openSettings();
})();
</script>
